name: Build FreeCut AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FreeCut AI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Find and Extract FreeCut AI Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Repository contents:"
          find . -maxdepth 2 -type f | sort

          echo "Searching ZIP files..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "First extraction contents:"
          find extracted -maxdepth 4 -type f | sort

          # If another ZIP exists inside, extract it
          INNER_ZIP=$(find extracted -type f -name "*.zip" | head -1)

          if [ -n "$INNER_ZIP" ]; then
            echo "Nested ZIP detected:"
            echo "$INNER_ZIP"

            mkdir -p extracted_inner

            unzip -q "$INNER_ZIP" -d extracted_inner

            rm -rf extracted
            mv extracted_inner extracted

            echo "Nested ZIP extracted successfully."
          fi

          echo "Searching for Gradle settings..."

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle project not found!"

            echo "Available files:"
            find extracted -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "================================="
          echo "Gradle project found:"
          echo "$PROJECT_DIR"
          echo "================================="

          # Clear temporary files from repository root
          rm -rf app gradle build.gradle.kts build.gradle settings.gradle.kts settings.gradle gradle.properties gradlew gradlew.bat

          cp -a "$PROJECT_DIR"/. .

          echo "Final project:"
          ls -lah

      - name: Generate Gradle Wrapper If Missing
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper missing."
            echo "Generating Gradle wrapper..."

            gradle wrapper --gradle-version 8.9

            echo "Gradle wrapper generated."
          else
            echo "Gradle wrapper already exists."
          fi

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          echo "Checking required files..."

          test -f settings.gradle.kts || test -f settings.gradle
          test -d app
          test -f gradlew

          echo "Android project verification successful."

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build Release AAB
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Show Build Outputs
        run: |
          echo "=============================="
          echo "DEBUG APK"
          echo "=============================="

          find app/build/outputs/apk -type f -print

          echo "=============================="
          echo "RELEASE AAB"
          echo "=============================="

          find app/build/outputs/bundle -type f -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut-AI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
