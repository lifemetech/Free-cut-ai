name: Build FreeCut AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FreeCut AI
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v7

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. EXTRACT FREECUT PROJECT
      # ==========================================
      - name: Extract FINAL FreeCut AI Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="FreeCut-AI-3.0.3-FINAL.zip"

          echo "=========================================="
          echo "CHECKING FREECUT AI ZIP"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found!"
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo ""
          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity check successful."

          # Clean previous extracted project
          rm -rf extracted
          mkdir -p extracted

          echo ""
          echo "Extracting project..."

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Searching for Gradle project..."

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle project not found inside ZIP!"
            echo ""
            echo "ZIP contents:"
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Project found:"
          echo "$PROJECT_DIR"

          # Remove repository project files
          rm -rf app
          rm -rf gradle

          rm -f build.gradle.kts
          rm -f build.gradle
          rm -f settings.gradle.kts
          rm -f settings.gradle
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat

          # Copy extracted project
          cp -a "$PROJECT_DIR"/. .

          echo ""
          echo "=========================================="
          echo "FINAL PROJECT LOADED"
          echo "=========================================="

          ls -lah

      # ==========================================
      # 5. VERIFY PROJECT
      # ==========================================
      - name: Verify Android Project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING ANDROID PROJECT"
          echo "=========================================="

          test -d app

          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "ERROR: settings.gradle(.kts) not found!"
            exit 1
          fi

          echo ""
          echo "Android project verification successful."

      # ==========================================
      # 6. GENERATE GRADLE WRAPPER IF NEEDED
      # ==========================================
      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then

            echo "Gradle wrapper missing."
            echo "Generating Gradle 8.9 wrapper..."

            gradle wrapper --gradle-version 8.9

          else

            echo "Gradle wrapper already exists."

          fi

          chmod +x ./gradlew

          echo ""
          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          ./gradlew --version

      # ==========================================
      # 7. CLEAN BUILD
      # ==========================================
      - name: Clean Build
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CLEAN BUILD"
          echo "=========================================="

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 8. BUILD DEBUG APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "DEBUG APK BUILD SUCCESSFUL."

      # ==========================================
      # 9. BUILD RELEASE AAB
      # ==========================================
      - name: Build Release AAB
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING RELEASE AAB"
          echo "=========================================="

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "RELEASE AAB BUILD SUCCESSFUL."

      # ==========================================
      # 10. SHOW OUTPUTS
      # ==========================================
      - name: Show Build Outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEBUG APK OUTPUT"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "=========================================="
          echo "RELEASE AAB OUTPUT"
          echo "=========================================="

          find app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print

      # ==========================================
      # 11. VERIFY APK EXISTS
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_COUNT=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "Debug APK found successfully."

      # ==========================================
      # 12. VERIFY AAB EXISTS
      # ==========================================
      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB_COUNT=$(find app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" | wc -l)

          if [ "$AAB_COUNT" -eq 0 ]; then
            echo "ERROR: Release AAB was not generated."
            exit 1
          fi

          echo "Release AAB found successfully."

      # ==========================================
      # 13. UPLOAD DEBUG APK
      # ==========================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ==========================================
      # 14. UPLOAD RELEASE AAB
      # ==========================================
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut-AI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # ==========================================
      # 15. BUILD SUMMARY
      # ==========================================
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "FREECUT AI BUILD COMPLETED"
          echo "=========================================="

          echo ""
          echo "APK:"
          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "AAB:"
          find app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            -print

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="
