name: Build FreeCut AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build FreeCut AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract FreeCut AI Project
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "FreeCut-AI-ONE-CLICK.zip" -d extracted

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle project not found!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project found at: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
