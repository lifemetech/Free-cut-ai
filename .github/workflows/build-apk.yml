name: Build FreeCut AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FreeCut AI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract FINAL FreeCut AI Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="FreeCut-AI-3.0.3-FINAL.zip"

          echo "Checking final ZIP..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found!"
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Searching for Gradle project..."

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle project not found!"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project found:"
          echo "$PROJECT_DIR"

          rm -rf app
          rm -rf gradle
          rm -f build.gradle.kts
          rm -f build.gradle
          rm -f settings.gradle.kts
          rm -f settings.gradle
          rm -f gradle.properties
          rm -f gradlew
          rm -f gradlew.bat

          cp -a "$PROJECT_DIR"/. .

          echo "=============================="
          echo "FINAL PROJECT LOADED"
          echo "=============================="

          ls -lah

          echo "Checking source files..."
          test -f settings.gradle.kts || test -f settings.gradle
          test -d app

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper missing."
            echo "Generating Gradle 8.9 wrapper..."

            gradle wrapper --gradle-version 8.9

          fi

          chmod +x ./gradlew

          echo "=============================="
          echo "GRADLE VERSION"
          echo "=============================="

          ./gradlew --version

      - name: Verify Android Project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project..."

          test -f gradlew
          test -d app
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project verification successful."

      - name: Clean Build
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build Release AAB
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Show Build Outputs
        run: |
          echo "=============================="
          echo "DEBUG APK"
          echo "=============================="

          find app/build/outputs/apk -type f -print

          echo "=============================="
          echo "RELEASE AAB"
          echo "=============================="

          find app/build/outputs/bundle -type f -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FreeCut-AI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
